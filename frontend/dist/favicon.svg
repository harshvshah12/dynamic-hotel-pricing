<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#020617"/> <!-- slate-950 -->
  <!-- Inner Glow -->
  <rect width="100" height="100" rx="20" fill="url(#grad)" opacity="0.15"/>
  
  <!-- Geometric Logo (Lumina RMS) -->
  <path d="M30 70 L30 30 L45 30 L45 55 L70 55 L70 70 Z" fill="url(#accent)"/>
  
  <circle cx="70" cy="40" r="8" fill="#10b981"/> <!-- emerald-500 dot -->

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/> <!-- emerald-400 -->
      <stop offset="100%" stop-color="#0ea5e9"/> <!-- sky-500 -->
    </linearGradient>
  </defs>
</svg>
